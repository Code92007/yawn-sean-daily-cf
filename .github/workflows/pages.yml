name: Update daily problems and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '35 1,9,17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-cf-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Yawn-Sean/Daily_CF_Problems
          path: upstream
          sparse-checkout: daily_problems
      - run: python scripts/update_metadata.py
      - run: python scripts/build_index.py upstream
      - run: python -m unittest discover -s tests
      - run: node --test tests/core.test.mjs
      - name: Keep refreshed data in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily problem index"
            git push
          fi
      - run: python scripts/prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
