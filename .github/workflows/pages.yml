name: Update daily problems and deploy Pages
on:
  push:
    branches: [main]
  schedule:
    # Asia/Shanghai: 08–12 and 20–24 hourly; 12–20 every four hours.
    - cron: '0 0,1,2,3,4,8,12,13,14,15,16 * * *'
  workflow_dispatch:
    inputs:
      approve_change:
        description: '确认合并历史差异的 ID（留空则仅增量更新）'
        required: false
        default: ''
        type: string
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: daily-cf-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/checkout@v4
        with:
          repository: Yawn-Sean/Daily_CF_Problems
          path: upstream
          fetch-depth: 100
          sparse-checkout: |
            daily_problems
            categories
            SheepCup
      - run: python scripts/update_metadata.py
      - run: python scripts/build_index.py upstream --approve-change "$APPROVE_CHANGE"
        env:
          APPROVE_CHANGE: ${{ inputs.approve_change }}
      - run: python -m unittest discover -s tests
      - run: node --test tests/core.test.mjs
      - name: Keep refreshed data in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data
          if ! git diff --cached --quiet; then
            git commit -m "Refresh daily problem index"
            git push
          fi
      - run: python scripts/prepare_site.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
