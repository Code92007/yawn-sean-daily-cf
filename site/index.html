<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Yawn-Sean Daily CF Problems · 每日一题</title><link rel="stylesheet" href="style.css"></head>
<body><header><a class="brand" href="./">Yawn-Sean Daily CF Problems</a><span>每日一题</span><a href="https://github.com/Yawn-Sean/Daily_CF_Problems" target="_blank" rel="noopener">题目来源 ↗</a></header>
<section class="account"><form id="accountForm"><input id="handle" aria-label="Codeforces 用户 ID" placeholder="Codeforces 用户 ID" maxlength="40"><button id="sync">同步提交</button><button id="clear" type="button" class="light">清除用户</button></form><span id="accountStatus" role="status">输入 ID，查看公开提交记录</span></section>
<main><div class="heading"><div><h1>每日一题题库</h1><p>按日期找到题目，记录每一道已完成的练习。</p></div><span id="update"></span></div>
<div class="toolbar"><label class="search">题号 / 名称<input id="query" placeholder="如 1900E、CF1900E、GYM101047F 或题目链接"></label><label>开始日期<input type="date" id="start"></label><label>结束日期<input type="date" id="end"></label><label>难度 ≥<input type="number" id="min" step="100" min="0" placeholder="不限"></label><label>难度 ≤<input type="number" id="max" step="100" min="0" placeholder="不限"></label><label>完成状态<select id="completion"><option value="all">全部</option><option value="solved">已完成</option><option value="unsolved">未标记 / 未查到 AC</option><option value="attempted">有提交，未查到 AC</option></select></label><button id="reset" class="light">重置筛选</button></div>
<div class="tabs" role="group" aria-label="比赛分类"><button data-category="all" class="active">全部</button><button data-category="div1">Div. 1</button><button data-category="div2">Div. 2</button><button data-category="gym">Gym</button><button data-category="other">其他 / 未分类</button></div>
<div class="summary"><span id="summary" role="status">正在加载题库…</span><div class="legend"><span class="dot solved"></span>已 AC / 手动完成 <span class="dot attempted"></span>尝试过 <span class="dot"></span>未查到 AC</div><label><input type="checkbox" id="hints">显示提示</label></div>
<div class="tablewrap"><table><thead><tr><th><button id="sort">日期 ↓</button></th><th>题目 1</th><th>题目 2</th></tr></thead><tbody id="rows"></tbody></table></div>
<div class="pagination"><button id="prev" class="light">上一页</button><span id="page"></span><button id="next" class="light">下一页</button></div>
<p class="note">难度来自每日一题仓库，* 表示原仓库估计难度。Div 分类依据 Codeforces 比赛名称，联合比赛归入两个分类。完成状态以公开 API 的 OK 提交为准；Gym 私有或不可见提交可能无法查询，支持手动标记。手动记录和缓存仅保存在当前浏览器。</p>
<footer>数据来源 <a href="https://github.com/Yawn-Sean/Daily_CF_Problems">Yawn-Sean / Daily_CF_Problems</a> · 静态题库每日自动更新</footer></main><script type="module" src="app.js"></script></body></html>
